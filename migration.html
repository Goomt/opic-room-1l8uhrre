<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>학습 기록 옮기기</title><style>body{font:16px/1.8 system-ui,sans-serif;background:#f4f5fa;color:#18231f;margin:0;padding:28px 20px}main{max-width:540px;margin:auto;background:white;padding:24px;border-radius:18px}button,a{display:block;padding:14px 18px;border-radius:12px;margin:16px 0}button{border:0;background:#365be2;color:white;font:inherit;width:100%;cursor:pointer}a{background:#eef1ff;color:#2447b7}p{overflow-wrap:anywhere}</style><main><h1>학습 기록을 새 연습실로 옮겨요</h1><p>이 페이지는 기존 연습실의 기록을 파일로 저장합니다. 먼저 기존에 공부하던 휴대폰·브라우저에서 열어 주세요.</p><button id="backup">1. 기존 학습 기록 저장하기</button><p id="status" role="status"></p><a href="https://opic-room-mobile.pages.dev/">2. 새 연습실 열기</a><p>새 연습실 아래쪽 ‘휴대폰 설치와 학습 기록 옮기기’에서 저장한 파일을 고르고 복원하세요.</p><p>완료·저장 문장, 교정 문장, 복습 일정, XP·코스 진도를 옮깁니다. 프로필·AI 코드·녹음·진행 중 문제는 제외합니다. 이 파일은 서버로 보내지 않습니다.</p></main><script>// Local progress transfer. Credentials, profiles, recordings and AI caches are excluded.
const PROGRESS_KEYS=['opic-done','opic-fav','opic-review','opic-corrected','opic-rewards','opic-game-progress'];
function progressObject(x){return x!==null&&typeof x==='object'&&!Array.isArray(x);}
function validateProgressBackup(file){
 if(!progressObject(file)||file.app!=='opic-room'||file.version!==1||!progressObject(file.data))throw Error('오픽 연습실 백업 파일인지 확인해 주세요.');
 const data=file.data;if(Object.keys(data).some(k=>!PROGRESS_KEYS.includes(k)))throw Error('지원하지 않는 데이터가 들어 있어요.');
 const walk=(v,depth=0)=>{if(depth>8)throw Error('백업 구조를 확인해 주세요.');if(v&&typeof v==='object')for(const k of Object.keys(v)){if(['__proto__','constructor','prototype'].includes(k))throw Error('지원하지 않는 데이터가 있어요.');walk(v[k],depth+1);}};walk(data);
 const strings=a=>Array.isArray(a)&&a.length<=10000&&a.every(x=>typeof x==='string'&&x.length<200);
 for(const key of ['opic-done','opic-fav'])if(key in data&&!strings(data[key]))throw Error('문장 진도 형식이 올바르지 않아요.');
 if('opic-review' in data&&(!progressObject(data['opic-review'])||Object.values(data['opic-review']).some(x=>!progressObject(x)||![0,1,2].includes(x.s)||!Number.isFinite(x.due))))throw Error('복습 일정 형식이 올바르지 않아요.');
 if('opic-corrected' in data&&(!progressObject(data['opic-corrected'])||Object.values(data['opic-corrected']).some(x=>!progressObject(x)||typeof x.en!=='string'||typeof x.ko!=='string'||x.en.length>10000)))throw Error('교정 문장 형식이 올바르지 않아요.');
 const rewards=data['opic-rewards'];if('opic-rewards' in data&&(!progressObject(rewards)||!Number.isFinite(rewards.xp)||rewards.xp<0||!Array.isArray(rewards.days)||!rewards.days.every(Number.isFinite)))throw Error('학습 보상 형식이 올바르지 않아요.');
 const games=data['opic-game-progress'];if('opic-game-progress' in data&&(!progressObject(games)||!Number.isFinite(games.courses)||!Number.isFinite(games.solved)||!progressObject(games.claims)||!Object.values(games.claims).every(x=>x===true)))throw Error('미션 진도 형식이 올바르지 않아요.');
 return data;
}
function createProgressBackup(storage){const data={};for(const k of PROGRESS_KEYS){const value=storage.getItem(k);if(value!==null)data[k]=JSON.parse(value);}const file={app:'opic-room',version:1,createdAt:new Date().toISOString(),data};validateProgressBackup(file);return file;}
function restoreProgressBackup(storage,file){const data=validateProgressBackup(file),old=[...PROGRESS_KEYS,'opic-play','opic-daily'].map(k=>[k,storage.getItem(k)]);try{for(const key of [...PROGRESS_KEYS,'opic-play','opic-daily']){if(key in data)storage.setItem(key,JSON.stringify(data[key]));else storage.removeItem(key);}}catch(error){for(const [key,value] of old){try{value===null?storage.removeItem(key):storage.setItem(key,value);}catch(_){}}throw error;}}
if(typeof module!=='undefined')module.exports={validateProgressBackup,createProgressBackup,restoreProgressBackup};

document.getElementById('backup').onclick=()=>{try{const file=createProgressBackup(localStorage),blob=new Blob([JSON.stringify(file,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='opic-progress-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='백업을 저장했어요. 저장 문장 '+(file.data['opic-fav']||[]).length+'개가 포함되어 있어요.';}catch(e){document.getElementById('status').textContent=e.message;}};
</script></html>

# 오픽 연습실 AI 중계 서버 (Cloudflare Workers 무료 플랜)
# 비밀값은 여기 적지 않고 `npx wrangler secret put 이름`으로 넣습니다.
#   OPENAI_API_KEY : OpenAI API 키 (첨삭·답변 만들기용)
#   APP_PASSCODE   : 앱에서 보내는 사용 코드 (모르는 사람이 써서 비용이 나가지 않게)
name = "opic-room-ai"
main = "src/index.js"
compatibility_date = "2026-09-01"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://goomt.github.io,http://localhost:8765,http://127.0.0.1:8765"
LLM_MODEL = "gpt-6-luna"
